# ------------------------------------------------------------------
# LiteLLM proxy secrets — fill in real values before applying.
# NEVER commit this file with real credentials.
#
# Create at deploy time instead:
#   oc create secret generic litellm-proxy \
#     --from-literal=LITELLM_MASTER_KEY='sk-litellm-...' \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     -n skill-optimization
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: litellm-proxy
  namespace: skill-optimization
  labels:
    app: litellm-proxy
    component: litellm-proxy
    app.kubernetes.io/part-of: cap-evolve
type: Opaque
stringData:
  # Bearer token Harbor / claude-code send as ANTHROPIC_AUTH_TOKEN / ANTHROPIC_API_KEY.
  LITELLM_MASTER_KEY: "<YOUR_LITELLM_MASTER_KEY>"
  # Direct OpenAI API key (api.openai.com).
  OPENAI_API_KEY: "<YOUR_OPENAI_API_KEY>"
  # ANTHROPIC_API_KEY: "<optional-for-anthropic-passthrough>"
