# ServiceAccount used by Harbor's OpenShift executor to launch per-task pods.
# Harbor hardcodes this ServiceAccount name ("harbor-task") when running
# `harbor run -e openshift`; each benchmark task pod runs under this identity.
#
# The task pod's admission was rejected against every SCC on this cluster,
# including a purpose-built "harbor-task-scc" that appears to already exist
# for exactly this use case (see the SCC admission error list captured from
# a real failed task pod). Bind to that scoped SCC rather than the broad
# "anyuid" SCC, since it is almost certainly the least-privilege option
# intended for this workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-task
  namespace: skill-optimization
  labels:
    app.kubernetes.io/part-of: cap-evolve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-task-scc
  namespace: skill-optimization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:harbor-task-scc
subjects:
  - kind: ServiceAccount
    name: harbor-task
    namespace: skill-optimization
