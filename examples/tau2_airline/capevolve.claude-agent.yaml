# cap-evolve spec — Claude Code CLI eval agent + user sim + claude-code optimizer.
capabilities: [system-prompt, tools]
capability_path: seed_capability
actions: [edit]
capability_sources: [seed_capability/reference/data_model.py]

optimizer_skill: claude-code
optimizer_model: claude-haiku-4-5
optimizer_max_turns: 200
optimizer_usd_per_iter: 40.0

algorithm_skill: hill-climb
algorithm_focus: all

dataset_source: adapter
split_seed: 0
split_train: 0.5
split_val: 0.25
split_test: 0.25
split_ids_file: split_ids.json

num_trials: 3
runner_model: claude-haiku-4-5

gate_mode: paired
gate_k_se: 0.2

max_iterations: 5
stall: 0
max_metric_calls: 0
max_usd: 500.0
max_optimizer_usd: 300.0

store: git
